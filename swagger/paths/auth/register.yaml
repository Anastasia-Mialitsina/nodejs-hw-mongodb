#swagger/paths/auth/register.yaml
post:
  tags:
    - Auth
  summary: Реєстрація нового користувача
  operationId: registerUser
  description: Реєстрація нового користувача з іменем, електронною поштою та паролем
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
              example: Anastasia
            email:
              type: string
              format: email
              example: anastasia@example.com
            password:
              type: string
              format: password
              example: strongPassword123
  responses:
    '201':
      description: Користувач успішно зареєстрований
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: User registered successfully
              data:
                type: object
                properties:
                  userId:
                    type: string
                    example: 6849f5449dc07a33d07263b0
    '400':
      description: Помилка валідації
    '409':
      description: Користувач з таким email вже існує
