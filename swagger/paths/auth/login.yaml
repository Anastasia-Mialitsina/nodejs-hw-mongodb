#swagger/paths/auth/login.yaml
post:
  tags:
    - Auth
  summary: Логін користувача
  operationId: loginUser
  description: Авторизація користувача за електронною поштою та паролем, повертає JWT токен
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              example: anastasia@example.com
            password:
              type: string
              format: password
              example: strongPassword123
  responses:
    '200':
      description: Успішний вхід, повертається JWT токен
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: User logged in successfully
              data:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    '400':
      description: Помилка валідації
    '401':
      description: Невірний email або пароль
