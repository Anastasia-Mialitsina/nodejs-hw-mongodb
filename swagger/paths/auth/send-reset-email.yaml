#swagger/paths/auth/send-reset-email.yaml
post:
  tags:
    - Auth
  summary: Надіслати лист для скиду паролю
  operationId: sendResetPasswordEmail
  description: Надсилає email з посиланням для скиду паролю користувачу
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
              example: user@example.com
  responses:
    '200':
      description: Лист успішно надіслано
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Reset password email has been successfully sent.
              data:
                type: object
                example: {}
    '404':
      description: Користувача не знайдено
    '500':
      description: Не вдалося надіслати листа
