#swagger/paths/contacts/post.yaml
post:
tags:
  - Contacts
summary: Додати новий контакт
operationId: createContact
description: Створює новий контакт користувача
security:
  - bearerAuth: []
requestBody:
  description: Дані нового контакту
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
        properties:
          name:
            type: string
            example: "Іван Іванов"
          email:
            type: string
            format: email
            example: "ivan@example.com"
          phone:
            type: string
            example: "+380501234567"
          contactType:
            type: string
            enum: [work, home, personal]
          isFavourite:
            type: boolean
            default: false
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Контакт успішно створено
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Некоректні дані
  '401':
    description: Неавторизований доступ