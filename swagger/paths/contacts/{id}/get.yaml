#swagger/paths/contacts/{id}/get.yaml
get:
  tags:
    - Contacts
  summary: Отримати контакт за ID
  operationId: getContactById
  description: Повертає контакт за його унікальним ідентифікатором
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: Ідентифікатор контакту
      schema:
        type: string
  responses:
    '200':
      description: Контакт знайдено
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/Contact.yaml'
    '404':
      description: Контакт не знайдено
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Контакт не знайдено
              data:
                type: 'null'
