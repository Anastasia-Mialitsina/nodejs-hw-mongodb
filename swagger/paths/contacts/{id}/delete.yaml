#swagger/paths/contacts/{id}/delete.yaml
tags:
  - Contacts
summary: Видалити контакт за ID
operationId: deleteContact
description: Видаляє контакт за його ідентифікатором
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Ідентифікатор контакту
    schema:
      type: string
responses:
  '200':
    description: Контакт успішно видалено
    content:
      application/json:
        schema:
          $ref: '../../../components/responses/Success.yaml'
  '401':
    description: Неавторизований доступ
  '404':
    description: Контакт не знайдено
