#swagger/paths/contacts/{id}/patch.yaml
tags:
  - Contacts
summary: Оновити контакт за ID
operationId: updateContact
description: Оновлює інформацію про контакт
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Ідентифікатор контакту
    schema:
      type: string
requestBody:
  description: Нові дані контакту
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "Іван Іванов"
          email:
            type: string
            format: email
            example: "ivan@example.com"
          phone:
            type: string
            example: "+380501234567"
          contactType:
            type: string
            enum: [work, home, personal]
          isFavourite:
            type: boolean
            default: false
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Контакт успішно оновлено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Некоректні дані
  '401':
    description: Неавторизований доступ
  '404':
    description: Контакт не знайдено
