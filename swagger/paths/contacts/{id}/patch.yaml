#swagger/paths/contacts/{id}/patch.yaml
patch:
tags:
  - Contacts
summary: Оновити контакт за ID
operationId: updateContact
description: Оновлює інформацію про контакт
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Ідентифікатор контакту
    schema:
      type: string
requestBody:
  description: Нові дані контакту
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "Іван Іванов"
          email:
            type: string
            format: email
            example: "ivan@example.com"
          phone:
            type: string
            example: "+380501234567"
          contactType:
            type: string
            enum: [work, home, personal]
          isFavourite:
            type: boolean
            default: false
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Контакт успішно оновлено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact patched
            data:
              type: object
              properties:
                _id:
                  type: string
                  example: "68580ac1105b7610d78f1acf"
                name:
                  type: string
                  example: "Test User"
                phoneNumber:
                  type: string
                  example: "+380501234567"
                email:
                  type: string
                  example: "testuser@example.com"
                isFavourite:
                  type: boolean
                  example: false
                contactType:
                  type: string
                  example: "work"
                photo:
                  type: string
                  example: ""
                userId:
                  type: string
                  example: "6857c644766081aee0bba104"
                createdAt:
                  type: string
                  format: date-time
                  example: "2025-06-22T13:53:05.700Z"
                updatedAt:
                  type: string
                  format: date-time
                  example: "2025-06-22T14:35:15.473Z"
                __v:
                  type: integer
                  example: 0
  '400':
    description: Некоректні дані
    content:
      application/json:
        oneOf:
          - schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: "\"email\" must be a valid email"
                data:
                  type: 'null'
                  example: null
          - schema:
              type: object
              properties:
                status:
                  type: integer
                  example: 400
                message:
                  type: string
                  example: Invalid contact ID
                data:
                  type: 'null'
                  example: null
  '401':
    description: Неавторизований доступ
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: No access token provided
            data:
              type: 'null'
              example: null
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            data:
              type: 'null'
              example: null
