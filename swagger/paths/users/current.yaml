#swagger/path/users/current.yaml
get:
  tags:
    - Auth
  summary: Get current user info
  operationId: getCurrentUser
  description: Повертає інформацію про поточного користувача
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Успішна відповідь з інформацією про користувача
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Current user info retrieved successfully
              data:
                type: object
                properties:
                  email:
                    type: string
                    example: user@example.com
                  name:
                    type: string
                    example: John Doe
    '401':
      description: Неавторизований доступ
