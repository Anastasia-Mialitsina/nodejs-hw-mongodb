#swagger/components/schemas/ContactInput.yaml
type: object
required:
  - name
  - email
properties:
  name:
    type: string
    example: "Іван Іванов"
  email:
    type: string
    format: email
    example: "ivan@example.com"
  phone:
    type: string
    example: "+380501234567"
  contactType:
    type: string
    enum: [work, home, personal]
    example: "home"
  isFavourite:
    type: boolean
    default: false
    example: true
  photo:
    type: string
    format: binary
