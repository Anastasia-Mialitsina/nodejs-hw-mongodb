# swagger/components/schemas/Contact.yaml
type: object
properties:
  _id:
    type: string
  name:
    type: string
  phoneNumber:
    type: string
  email:
    type: string
  isFavourite:
    type: boolean
  contactType:
    type: string
    enum: [home, work, personal]
  photo:
    type: string
  userId:
    type: string
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
